{{- /* Renders ```mermaid code blocks as figures scaled to the content width, plus a zoom overlay. */ -}}
<script>
(function () {
    var blocks = document.querySelectorAll('pre > code.language-mermaid');
    if (!blocks.length || !window.mermaid) return;

    var modal, canvas, scaleLabel;
    var scale = 1;
    var baseWidth = 0;
    var baseHeight = 0;

    var nodes = [];
    blocks.forEach(function (code) {
        var figure = document.createElement('figure');
        figure.className = 'mermaid-figure';

        var holder = document.createElement('div');
        holder.className = 'mermaid';
        holder.textContent = code.textContent;

        var zoom = document.createElement('button');
        zoom.type = 'button';
        zoom.className = 'mermaid-zoom';
        zoom.title = 'Enlarge diagram';
        zoom.textContent = 'Enlarge';
        zoom.addEventListener('click', function () { openModal(holder); });

        figure.appendChild(holder);
        figure.appendChild(zoom);
        code.parentNode.replaceWith(figure);
        nodes.push(holder);
    });

    if (typeof mermaid.run === 'function') {
        mermaid.run({ nodes: nodes, suppressErrors: true });
    } else {
        mermaid.init(undefined, nodes);
    }

    function buildModal() {
        modal = document.createElement('div');
        modal.className = 'mermaid-modal';
        modal.hidden = true;
        modal.innerHTML =
            '<div class="mermaid-modal-toolbar">' +
            '<button type="button" data-act="out" aria-label="Zoom out">&minus;</button>' +
            '<span class="mermaid-modal-scale">100%</span>' +
            '<button type="button" data-act="in" aria-label="Zoom in">+</button>' +
            '<button type="button" data-act="fit">Fit</button>' +
            '<button type="button" data-act="close">Close</button>' +
            '</div>' +
            '<div class="mermaid-modal-canvas"></div>';
        document.body.appendChild(modal);

        canvas = modal.querySelector('.mermaid-modal-canvas');
        scaleLabel = modal.querySelector('.mermaid-modal-scale');

        modal.querySelector('.mermaid-modal-toolbar').addEventListener('click', function (e) {
            var act = e.target.getAttribute('data-act');
            if (act === 'in') setScale(scale * 1.25);
            else if (act === 'out') setScale(scale / 1.25);
            else if (act === 'fit') setScale(fitScale());
            else if (act === 'close') closeModal();
        });

        canvas.addEventListener('mousedown', startPan);
        document.addEventListener('keydown', function (e) {
            if (modal && !modal.hidden && e.key === 'Escape') closeModal();
        });
    }

    function fitScale() {
        return baseWidth ? (canvas.clientWidth - 36) / baseWidth : 1;
    }

    function setScale(next) {
        scale = Math.min(8, Math.max(0.2, next));
        var svg = canvas.querySelector('svg');
        if (!svg) return;
        svg.style.width = (baseWidth * scale) + 'px';
        svg.style.height = (baseHeight * scale) + 'px';
        scaleLabel.textContent = Math.round(scale * 100) + '%';
    }

    function openModal(holder) {
        var svg = holder.querySelector('svg');
        if (!svg) return;
        if (!modal) buildModal();

        var box = svg.getBoundingClientRect();
        var view = svg.viewBox && svg.viewBox.baseVal;
        baseWidth = (view && view.width) || box.width || 800;
        baseHeight = (view && view.height) || box.height || 600;

        var clone = svg.cloneNode(true);
        clone.removeAttribute('width');
        clone.removeAttribute('height');
        clone.style.maxWidth = 'none';
        canvas.innerHTML = '';
        canvas.appendChild(clone);

        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        setScale(Math.min(2.5, Math.max(1, fitScale())));
    }

    function closeModal() {
        modal.hidden = true;
        canvas.innerHTML = '';
        document.body.style.overflow = '';
    }

    function startPan(e) {
        if (e.button !== 0) return;
        var startX = e.clientX;
        var startY = e.clientY;
        var startLeft = canvas.scrollLeft;
        var startTop = canvas.scrollTop;
        canvas.classList.add('is-panning');

        function move(ev) {
            canvas.scrollLeft = startLeft - (ev.clientX - startX);
            canvas.scrollTop = startTop - (ev.clientY - startY);
        }
        function up() {
            canvas.classList.remove('is-panning');
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
        }

        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
        e.preventDefault();
    }
})();
</script>
